pid /run/nginx/nginx.pid;
thread_pool default threads=4 max_queue=256;
error_log stderr crit;

worker_processes auto;
worker_rlimit_nofile 32768;
worker_shutdown_timeout 1d;

events {
    worker_connections 8192;
}

http {
    # Never persist request-associated error details or client addresses.
    error_log /dev/null crit;
    root /var/empty;

    include mime.types;
    default_type application/octet-stream;

    charset utf-8;
    charset_types text/css text/javascript text/plain text/xml application/atom+xml;

    keepalive_requests 16;
    keepalive_timeout 0;
    server_tokens off;
    msie_padding off;

    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    http2_chunk_size 4k;

    reset_timedout_connection on;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    max_headers 50;
    max_ranges 1;

    resolver 127.0.0.53;
    resolver_timeout 15s;

    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    proxy_http_version 1.1;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Cookie "";
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504 http_429;

    proxy_ssl_protocols TLSv1.3;
    proxy_ssl_server_name on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;

    proxy_cache_path /var/cache/nginx/ct.diamaneos.de use_temp_path=off keys_zone=ct.diamaneos.de:1m inactive=1h max_size=10m;
    proxy_cache_path /var/cache/nginx/psds.diamaneos.de use_temp_path=off keys_zone=psds.diamaneos.de:1m inactive=1h max_size=10m;

    http2_max_concurrent_streams 16;
    limit_conn_status 429;
    limit_conn_zone $binary_remote_addr zone=http-limit:10m;
    limit_conn http-limit 128;
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=relay-limit:10m rate=10r/s;

    ssl_buffer_size 4k;
    ssl_protocols TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_conf_command Options PrioritizeChaCha;
    ssl_conf_command SignatureAlgorithms ECDSA+SHA256:ECDSA+SHA384:ECDSA+SHA512;
    ssl_certificate_compression on;

    # managed externally in noswap tmpfs
    ssl_session_ticket_key /etc/tls/session-ticket-keys/4.key;
    ssl_session_ticket_key /etc/tls/session-ticket-keys/3.key;
    ssl_session_ticket_key /etc/tls/session-ticket-keys/2.key;
    ssl_session_ticket_key /etc/tls/session-ticket-keys/1.key;
    ssl_session_ticket_key /etc/tls/session-ticket-keys/next.key;
    ssl_session_timeout 1d;

    ssl_certificate /etc/letsencrypt/live/diamaneos-primary/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diamaneos-primary/privkey.pem;

    access_log off;
    log_subrequest off;
    log_not_found off;

    gzip_proxied any;
    gzip_vary on;

    if_modified_since before;

    aio threads;
    aio_write on;

    map $msec $msec_integer {
        ~(\d+)\.(\d+) $1$2;
    }

    upstream www.gstatic.com {
        zone www.gstatic.com 128k;
        server www.gstatic.com:443 max_conns=1024 max_fails=0 resolve;
        keepalive 32;
    }

    upstream remoteprovisioning.googleapis.com {
        zone remoteprovisioning.googleapis.com 128k;
        server remoteprovisioning.googleapis.com:443 max_conns=1024 max_fails=0 resolve;
        keepalive 32;
    }

    upstream www.googleapis.com {
        zone www.googleapis.com 128k;
        server www.googleapis.com:443 max_conns=1024 max_fails=0 resolve;
        keepalive 32;
    }

    upstream path1.xtracloud.net {
        zone path1.xtracloud.net 128k;
        server path1.xtracloud.net:443 max_conns=1024 max_fails=0 resolve;
        keepalive 32;
    }



    upstream gs-loc.apple.com {
        zone gs-loc.apple.com 128k;
        server gs-loc.apple.com:443 max_conns=1024 max_fails=0 resolve;
        keepalive 32;
    }

    # use glob to conditionally include releases.conf if it exists
    include releases[.]conf;

    server {
        listen 80 default_server backlog=4096 fastopen=16 rcvbuf=2048 sndbuf=2048;
        listen [::]:80 default_server backlog=4096 fastopen=16 rcvbuf=2048 sndbuf=2048;

        # https://trac.nginx.org/nginx/ticket/2012
        location / {
            return 421;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name connectivitycheck.diamaneos.de online.diamaneos.de;

        location = /generate_204 {
            add_header X-Robots-Tag "none" always;
            return 204;
        }

        location = /gen_204 {
            add_header X-Robots-Tag "none" always;
            return 204;
        }

        location /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt/webroot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name time.diamaneos.de ct.diamaneos.de psds.diamaneos.de remoteprovisioning.diamaneos.de widevineprovisioning.diamaneos.de supl.diamaneos.de location.diamaneos.de;

        location /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt/webroot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 default_server ssl backlog=4096 fastopen=16;
        listen [::]:443 default_server ssl backlog=4096 fastopen=16;
        http2 on;
        ssl_reject_handshake on;

        # https://trac.nginx.org/nginx/ticket/2012
        location / {
            return 421;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name connectivitycheck.diamaneos.de online.diamaneos.de;

        location = /generate_204 {
            add_header X-Robots-Tag "none" always;
            return 204;
        }

        location = /gen_204 {
            add_header X-Robots-Tag "none" always;
            return 204;
        }

        location = / {
            return 301 https://diamaneos.de/faq#default-connections;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name time.diamaneos.de;

        # The upstream response is available only while authenticated local
        # time meets the host contract. No new HTTP time implementation.
        open_file_cache off;
        if (!-f /run/diamaneos-clock/ready) { return 503; }

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location = / {
            # work around regression in early port to Android 14 not using /generate_204

            # note: location block keepalive configuration does not work for HTTP/2
            keepalive_requests 2;
            keepalive_timeout 15s;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Time $msec_integer;

            if ($http_user_agent ~ "Dalvik/2.1.0") {
                return 204;
            }

            return 301 https://diamaneos.de/faq#default-connections;
        }

        location = /generate_204 {
            # note: location block keepalive configuration does not work for HTTP/2
            keepalive_requests 2;
            keepalive_timeout 15s;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Robots-Tag "none" always;
            add_header X-Time $msec_integer;

            return 204;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ct.diamaneos.de;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        proxy_ignore_headers Set-Cookie X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;

        proxy_hide_header Alt-Svc;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Robots-Tag;

        proxy_cache ct.diamaneos.de;
        proxy_cache_key $uri; # ignore query string
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504 http_429;
        proxy_cache_background_update on;

        proxy_pass_request_body off;
        proxy_pass_request_headers off;

        proxy_max_temp_file_size 8m;

        open_file_cache max=5 inactive=1h;
        open_file_cache_valid 1h;

        location /android/certificate_transparency/v2/log_list.json {
            if ($request_method != GET) {
                return 405;
            }
            limit_req zone=relay-limit burst=32 nodelay;
            proxy_pass https://www.gstatic.com;

            # note: location block keepalive configuration does not work for HTTP/2
            keepalive_timeout 15s;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Robots-Tag "none" always;
        }

        location /android/certificate_transparency/v2/log_list.sig {
            if ($request_method != GET) {
                return 405;
            }
            limit_req zone=relay-limit burst=32 nodelay;
            proxy_pass https://www.gstatic.com;

            # note: location block keepalive configuration does not work for HTTP/2
            keepalive_timeout 15s;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Robots-Tag "none" always;
        }

        location /android/certificate_transparency/v3/log_list.ctfb {
            if ($request_method != GET) {
                return 405;
            }
            limit_req zone=relay-limit burst=32 nodelay;
            proxy_pass https://www.gstatic.com;

            # note: location block keepalive configuration does not work for HTTP/2
            keepalive_timeout 15s;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Robots-Tag "none" always;
        }

        location /android/certificate_transparency/v3/log_list.sig {
            if ($request_method != GET) {
                return 405;
            }
            limit_req zone=relay-limit burst=32 nodelay;
            proxy_pass https://www.gstatic.com;

            # note: location block keepalive configuration does not work for HTTP/2
            keepalive_timeout 15s;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Robots-Tag "none" always;
        }

        location /android/certificate_transparency/log_list.pub {
            if ($request_method != GET) {
                return 405;
            }
            limit_req zone=relay-limit burst=32 nodelay;
            proxy_pass https://www.gstatic.com;

            # note: location block keepalive configuration does not work for HTTP/2
            keepalive_timeout 15s;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Robots-Tag "none" always;
        }

        location = / {
            return 301 https://diamaneos.de/faq#default-connections;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name remoteprovisioning.diamaneos.de;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # before Android 14 QPR2: '/v1:'
        # after Android 14 QPR2: '/v1/:'
        location ~ ^/v1/?: {
            if ($request_method != POST) {
                return 405;
            }
            limit_req zone=relay-limit burst=32 nodelay;
            proxy_pass https://remoteprovisioning.googleapis.com;

            # note: location block keepalive configuration does not work for HTTP/2
            keepalive_timeout 15s;

            client_max_body_size 16k;
            client_body_buffer_size 16k;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Robots-Tag "none" always;

            proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;

            proxy_hide_header Alt-Svc;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Robots-Tag;

            proxy_max_temp_file_size 8m;
            access_log off;
        }

        location = / {
            return 301 https://diamaneos.de/faq#default-connections;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name widevineprovisioning.diamaneos.de;

        # needed to handle long signedRequest
        large_client_header_buffers 4 8k;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location /certificateprovisioning/v1 {
            if ($request_method != POST) {
                return 405;
            }
            limit_req zone=relay-limit burst=32 nodelay;
            proxy_pass https://www.googleapis.com;

            client_max_body_size 16k;
            client_body_buffer_size 16k;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Robots-Tag "none" always;

            proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;

            proxy_hide_header Alt-Svc;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Robots-Tag;

            proxy_max_temp_file_size 8m;
            access_log off;
        }

        location = / {
            return 301 https://diamaneos.de/faq#default-connections;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name psds.diamaneos.de;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        proxy_ignore_headers Set-Cookie X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;

        proxy_hide_header Age; # not accurate due to our caching
        proxy_hide_header Alt-Svc;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Via;
        proxy_hide_header X-Amz-Cf-Id;
        proxy_hide_header X-Amz-Cf-Pop;
        proxy_hide_header x-amz-meta-xtra-di;
        proxy_hide_header x-amz-server-side-encryption;
        proxy_hide_header X-Cache;
        proxy_hide_header X-Robots-Tag;

        proxy_cache psds.diamaneos.de;
        proxy_cache_key $uri; # ignore query string
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504 http_429;
        proxy_cache_background_update on;

        proxy_pass_request_body off;
        proxy_pass_request_headers off;

        proxy_max_temp_file_size 8m;

        open_file_cache max=1 inactive=1h;
        open_file_cache_valid 1h;

        location = /xtra3Mgrbeji.bin {
            if ($request_method != GET) {
                return 405;
            }
            limit_req zone=relay-limit burst=32 nodelay;
            proxy_pass https://path1.xtracloud.net/xtra3Mgrbeji.bin;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Robots-Tag "none" always;
        }

        location = / {
            return 301 https://diamaneos.de/faq#default-connections;
        }

        location / {
            return 404;
        }
    }


    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name supl.diamaneos.de;

        ssl_certificate /etc/letsencrypt/live/diamaneos-primary/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/diamaneos-primary/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location = / {
            return 301 https://diamaneos.de/faq#other-connections;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name location.diamaneos.de;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location = /clls/wloc {
            if ($request_method != POST) {
                return 405;
            }
            limit_req zone=relay-limit burst=32 nodelay;
            proxy_pass https://gs-loc.apple.com;

            # note: location block keepalive configuration does not work for HTTP/2
            keepalive_requests 256;
            keepalive_timeout 15s;

            client_max_body_size 1k;
            client_body_buffer_size 1k;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Robots-Tag "none" always;

            proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;

            proxy_hide_header Alt-Svc;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-RID;
            proxy_hide_header X-Robots-Tag;

            proxy_ssl_protocols TLSv1.3;

            proxy_max_temp_file_size 0;
        }

        location = / {
            return 301 https://diamaneos.de/faq#default-connections;
        }

        location / {
            return 404;
        }
    }

    server {
        listen unix:/run/nginx/status.sock;
        access_log off;

        location = / {
            stub_status;
        }

        location / {
            return 404;
        }
    }
}

stream {
    error_log /dev/null crit;
    limit_conn_zone $binary_remote_addr zone=supl-limit:10m;
    limit_conn supl-limit 128;
    resolver 127.0.0.53;
    resolver_timeout 15s;

    proxy_connect_timeout 5s;
    proxy_timeout 15s;

    ssl_handshake_timeout 15s;

    proxy_ssl on;
    proxy_ssl_protocols TLSv1.3;
    proxy_ssl_server_name on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;

    # SUPL clients may need TLS 1.2; TLS 1.1 is excluded.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_conf_command Options PrioritizeChaCha;

    ssl_certificate /etc/letsencrypt/live/diamaneos-supl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diamaneos-supl/privkey.pem;

    # maintained by rotate-session-ticket-keys in noswap tmpfs
    ssl_session_ticket_key /etc/tls/session-ticket-keys/4.key;
    ssl_session_ticket_key /etc/tls/session-ticket-keys/3.key;
    ssl_session_ticket_key /etc/tls/session-ticket-keys/2.key;
    ssl_session_ticket_key /etc/tls/session-ticket-keys/1.key;
    ssl_session_ticket_key /etc/tls/session-ticket-keys/next.key;
    ssl_session_timeout 1d;

    access_log off;

    upstream supl.google.com {
        zone supl.google.com 128k;
        server supl.google.com:7275 max_conns=1024 max_fails=0 resolve;
    }

    # Pixel 5a and earlier use Qualcomm SUPL without SNI support
    #
    # Pixel 8a and later use Samsung SUPL which used to lack SNI support on old OS versions
    server {
        listen 7275 default_server ssl backlog=4096 fastopen=16;
        listen [::]:7275 default_server ssl backlog=4096 fastopen=16;

        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305;

        ssl_certificate /etc/letsencrypt/live/diamaneos-supl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/diamaneos-supl/privkey.pem;

        proxy_pass supl.google.com;
    }

    server {
        listen 7275 ssl;
        listen [::]:7275 ssl;
        server_name supl.diamaneos.de;

        proxy_pass supl.google.com;
    }
}
